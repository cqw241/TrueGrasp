misconceptions:
- id: calc.ch5.substitution.old_bounds
  knowledge_point: calc.ch5.substitution
  family: 混用换元前后变量
  description: 换元后使用新变量积分，却仍沿用旧变量的积分上下限
  triggers: [换元前后的端点值不同]
  examples:
  - question: '计算 $\int_0^1(2x+1)\,dx$，指定 $u=2x+1$'
    wrong: '\frac{1}{4}'
    correct: '2'
  probes: [calc.ch5.substitution.probe_bounds_scale]
  recurs_in: [calc.ch10.double_integral_cartesian, calc.ch10.polar]
  strategies: [coordinate_consistency]
- id: calc.ch5.substitution.omit_differential
  knowledge_point: calc.ch5.substitution
  family: 忽略微元变换
  description: 定积分中已换积分变量和上下限，但遗漏微元中的比例因子
  triggers: [非单位比例换元]
  examples:
  - question: '计算 $\int_0^1(2x+1)\,dx$，指定 $u=2x+1$'
    wrong: '4'
    correct: '2'
  probes: [calc.ch5.substitution.probe_bounds_scale]
  recurs_in: [calc.ch10.polar]
  strategies: [differential_measure]
- id: calc.ch5.integration_by_parts.omit_boundary
  knowledge_point: calc.ch5.integration_by_parts
  family: 遗漏定积分边界项
  description: '把定积分分部公式中的边界项 [uv]_a^b 丢掉，只保留负的剩余积分'
  triggers: [乘积型被积函数]
  examples:
  - question: '计算 $\int_0^1 xe^x\,dx$，取 $u=x,dv=e^x dx$'
    wrong: 1-e
    correct: '1'
  probes: [calc.ch5.integration_by_parts.probe_x_exp]
  recurs_in: [calc.ch10.double_integral_cartesian]
  strategies: [integration_boundary]
- id: calc.ch5.integration_by_parts.plus_remainder
  knowledge_point: calc.ch5.integration_by_parts
  family: 分部积分符号错误
  description: 把分部积分公式中的减号写成加号
  triggers: [由乘积求导公式反推积分]
  examples:
  - question: '计算 $\int_0^1 xe^x\,dx$，取 $u=x,dv=e^x dx$'
    wrong: 2e-1
    correct: '1'
  probes: [calc.ch5.integration_by_parts.probe_x_exp]
  recurs_in: [calc.ch10.double_integral_cartesian]
  strategies: [integration_boundary]
strategies:
- id: coordinate_consistency
  families: [混用换元前后变量]
  principles:
  - 积分变量、微元和上下限必须描述同一坐标体系。
  - 定积分的上下限是有方向的端点，减函数换元应同时反映方向变化。
  constraints:
  - 不混用新变量的函数式与旧变量的端点。
  - 不在回代原变量后仍使用新变量端点。
  rubric:
  - 能对应解释每个新端点来自哪个原端点。
  - 能保持积分方向与微元符号一致。
- id: integration_boundary
  families: [遗漏定积分边界项, 分部积分符号错误]
  principles:
  - 分部积分来自乘积求导的积分形式，边界项与剩余积分共同保持恒等关系。
  - 非负被积函数在正向区间上的积分非负，可辅助排查边界项和符号错误。
  constraints:
  - 不把定积分的边界项省略成一个不定常数。
  - 不只凭选 u、dv 的口诀代替对恒等式的理解。
  rubric:
  - 能说明减号与边界项的来源。
  - 上下端点均被正确代入，剩余积分仍保留原积分区间。
items:
- id: calc.ch5.substitution.probe_bounds_scale
  knowledge_point: calc.ch5.substitution
  purpose: probe
  stem: '用 $u=2x+1$ 换元，计算 $\int_0^1(2x+1)\,dx$'
  spec:
    operation: definite_integral
    expr: 2*x+1
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '2'
  predictions:
  - misconception_id: calc.ch5.substitution.old_bounds
    answer: '\frac{1}{4}'
  - misconception_id: calc.ch5.substitution.omit_differential
    answer: '4'
- id: calc.ch5.substitution.seed_exp
  knowledge_point: calc.ch5.substitution
  purpose: verification
  dimension: correctness
  stem: '计算 $\int_0^1 xe^{x^2}\,dx$'
  spec:
    operation: definite_integral
    expr: x*exp(x**2)
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '\frac{e-1}{2}'
- id: calc.ch5.substitution.seed_reverse
  knowledge_point: calc.ch5.substitution
  purpose: verification
  dimension: near_transfer
  stem: '用 $u=2-x$ 换元，计算 $\int_0^1(2-x)^2\,dx$'
  spec:
    operation: definite_integral
    expr: (2-x)**2
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '\frac{7}{3}'
- id: calc.ch5.integration_by_parts.probe_x_exp
  knowledge_point: calc.ch5.integration_by_parts
  purpose: probe
  stem: '取 $u=x,dv=e^x dx$，计算 $\int_0^1 xe^x\,dx$'
  spec:
    operation: definite_integral
    expr: x*exp(x)
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '1'
  predictions:
  - misconception_id: calc.ch5.integration_by_parts.omit_boundary
    answer: 1-e
  - misconception_id: calc.ch5.integration_by_parts.plus_remainder
    answer: 2e-1
- id: calc.ch5.integration_by_parts.seed_x_cos
  knowledge_point: calc.ch5.integration_by_parts
  purpose: verification
  dimension: correctness
  stem: '计算 $\int_0^1 x\cos x\,dx$'
  spec:
    operation: definite_integral
    expr: x*cos(x)
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '\sin(1)+\cos(1)-1'
- id: calc.ch5.integration_by_parts.seed_log
  knowledge_point: calc.ch5.integration_by_parts
  purpose: verification
  dimension: near_transfer
  stem: '计算 $\int_1^e \ln x\,dx$'
  spec:
    operation: definite_integral
    expr: log(x)
    variables: [x]
    bounds:
    - var: x
      lower: '1'
      upper: E
  answer: '1'
