misconceptions:
- id: calc.ch5.substitution.old_bounds
  knowledge_point: calc.ch5.substitution
  family: 混用换元前后变量
  description: 换元后使用新变量积分，却仍沿用旧变量的积分上下限
  triggers: [换元前后的端点值不同]
  examples:
  - question: '计算 $\int_0^1(2x+1)\,dx$，指定 $u=2x+1$'
    wrong: '\frac{1}{4}'
    correct: '2'
  probes: [calc.ch5.substitution.probe_bounds_scale]
  recurs_in: [calc.ch10.double_integral_cartesian, calc.ch10.polar]
  strategies: [coordinate_consistency]
- id: calc.ch5.substitution.omit_differential
  knowledge_point: calc.ch5.substitution
  family: 忽略微元变换
  description: 定积分中已换积分变量和上下限，但遗漏微元中的比例因子
  triggers: [非单位比例换元]
  examples:
  - question: '计算 $\int_0^1(2x+1)\,dx$，指定 $u=2x+1$'
    wrong: '4'
    correct: '2'
  probes: [calc.ch5.substitution.probe_bounds_scale]
  recurs_in: [calc.ch10.polar]
  strategies: [differential_measure]
- id: calc.ch5.integration_by_parts.omit_boundary
  knowledge_point: calc.ch5.integration_by_parts
  family: 遗漏定积分边界项
  description: '把定积分分部公式中的边界项 [uv]_a^b 丢掉，只保留负的剩余积分'
  triggers: [乘积型被积函数]
  examples:
  - question: '计算 $\int_0^1 xe^x\,dx$，取 $u=x,dv=e^x dx$'
    wrong: 1-e
    correct: '1'
  probes: [calc.ch5.integration_by_parts.probe_x_exp]
  recurs_in: [calc.ch10.double_integral_cartesian]
  strategies: [integration_boundary]
- id: calc.ch5.integration_by_parts.plus_remainder
  knowledge_point: calc.ch5.integration_by_parts
  family: 分部积分符号错误
  description: 把分部积分公式中的减号写成加号
  triggers: [由乘积求导公式反推积分]
  examples:
  - question: '计算 $\int_0^1 xe^x\,dx$，取 $u=x,dv=e^x dx$'
    wrong: 2e-1
    correct: '1'
  probes: [calc.ch5.integration_by_parts.probe_x_exp]
  recurs_in: [calc.ch10.double_integral_cartesian]
  strategies: [integration_boundary]
- id: calc.ch5.s1.c3.signed_integral_as_area
  knowledge_point: calc.ch5.s1
  family: 混淆积分的权重方向与范围
  description: 把定积分无条件解释为几何面积，在被积函数变号时把负面积也计为正。
  triggers:
  - 定积分的概念与性质
  examples:
  - question: '求 $\int_{-2}^{2}x^3\,dx$。'
    wrong: '8'
    correct: '0'
  strategies:
  - c3.integral
  recurs_in:
  - calc.ch6.s2
  - calc.ch11.s2
- id: calc.ch5.s2.c3.upper_limit_missing_chain
  knowledge_point: calc.ch5.s2
  family: 混淆导数阶次或微分近似
  description: 对变上限积分求导时只代入上限，遗漏上限函数的导数。
  triggers:
  - 微积分基本公式
  examples:
  - question: '设 $F(x)=\int_1^{3x}t^2\,dt$，求 F′(x)。'
    wrong: '9x^2'
    correct: '27x^2'
  strategies:
  - c3.derivative
  recurs_in:
  - calc.ch7.s4
  - calc.ch9.multivar_chain
- id: calc.ch5.s4.c3.principal_value_as_integral
  knowledge_point: calc.ch5.s4
  family: 忽略数学命题的适用条件
  description: 对有内部奇点的反常积分直接对称抵消，把柯西主值误作通常反常积分。
  triggers:
  - 反常积分
  examples:
  - question: '判断通常意义的 $\int_{-2}^{2}1/x\,dx$ 是否收敛，说明理由。'
    wrong: '奇函数对称积分为 0，所以收敛。'
    correct: '不收敛。须在奇点 $0$ 两侧独立取极限；左侧积分趋于 $-\infty$，右侧趋于 $+\infty$，二者均不收敛。对称截断得到的主值 $0$ 不等于通常反常积分存在。'
  strategies:
  - c3.conditions
  recurs_in:
  - calc.ch5.s5
  - calc.ch11.s3
- id: calc.ch5.s5.c3.comparison_wrong_direction
  knowledge_point: calc.ch5.s5
  family: 忽略数学命题的适用条件
  description: 认为被较大发散函数控制的较小正函数也必发散，颠倒比较判别的推理方向。
  triggers:
  - 反常积分的审敛法
  examples:
  - question: '判断 $\int_1^{\infty}x^{-3}\,dx$ 是否收敛；能否仅凭 $0<x^{-3}\le x^{-1}$ 且后者积分发散就断言前者发散？'
    wrong: '较大的 1/x 积分发散，所以 1/x³ 也发散。'
    correct: '收敛，值为 $1/2$。截断积分为 $(1-R^{-2})/2$，$R\to\infty$ 时趋于 $1/2$。由较大函数发散不能推出较小函数发散；比较法须使用正确的上下界方向。'
  strategies:
  - c3.conditions
  recurs_in:
  - calc.ch12.s2
strategies:
- id: coordinate_consistency
  families: [混用换元前后变量]
  principles:
  - 积分变量、微元和上下限必须描述同一坐标体系。
  - 定积分的上下限是有方向的端点，减函数换元应同时反映方向变化。
  constraints:
  - 不混用新变量的函数式与旧变量的端点。
  - 不在回代原变量后仍使用新变量端点。
  rubric:
  - 能对应解释每个新端点来自哪个原端点。
  - 能保持积分方向与微元符号一致。
- id: integration_boundary
  families: [遗漏定积分边界项, 分部积分符号错误]
  principles:
  - 分部积分来自乘积求导的积分形式，边界项与剩余积分共同保持恒等关系。
  - 非负被积函数在正向区间上的积分非负，可辅助排查边界项和符号错误。
  constraints:
  - 不把定积分的边界项省略成一个不定常数。
  - 不只凭选 u、dv 的口诀代替对恒等式的理解。
  rubric:
  - 能说明减号与边界项的来源。
  - 上下端点均被正确代入，剩余积分仍保留原积分区间。
- id: c3.integral
  families:
  - 混淆积分的权重方向与范围
  principles:
  - 积分的被积量、微元、方向和区域必须共同对应原问题。
  - 用符号、量纲、对称性与简单情形交叉检查积分式。
  constraints:
  - 不把带符号积分自动解释为几何面积。
  - 不省略长度、面积、体积或密度权重。
  rubric:
  - 能解释被积量及微元各自来源。
  - 能核对上下限、方向、归一化因子和结果量纲。
items:
- id: calc.ch5.substitution.probe_bounds_scale
  knowledge_point: calc.ch5.substitution
  purpose: probe
  stem: '用 $u=2x+1$ 换元，计算 $\int_0^1(2x+1)\,dx$'
  spec:
    operation: definite_integral
    expr: 2*x+1
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '2'
  predictions:
  - misconception_id: calc.ch5.substitution.old_bounds
    answer: '\frac{1}{4}'
  - misconception_id: calc.ch5.substitution.omit_differential
    answer: '4'
- id: calc.ch5.substitution.seed_exp
  knowledge_point: calc.ch5.substitution
  purpose: verification
  dimension: correctness
  stem: '计算 $\int_0^1 xe^{x^2}\,dx$'
  spec:
    operation: definite_integral
    expr: x*exp(x**2)
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '\frac{e-1}{2}'
- id: calc.ch5.substitution.seed_reverse
  knowledge_point: calc.ch5.substitution
  purpose: verification
  dimension: near_transfer
  stem: '用 $u=2-x$ 换元，计算 $\int_0^1(2-x)^2\,dx$'
  spec:
    operation: definite_integral
    expr: (2-x)**2
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '\frac{7}{3}'
- id: calc.ch5.integration_by_parts.probe_x_exp
  knowledge_point: calc.ch5.integration_by_parts
  purpose: probe
  stem: '取 $u=x,dv=e^x dx$，计算 $\int_0^1 xe^x\,dx$'
  spec:
    operation: definite_integral
    expr: x*exp(x)
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '1'
  predictions:
  - misconception_id: calc.ch5.integration_by_parts.omit_boundary
    answer: 1-e
  - misconception_id: calc.ch5.integration_by_parts.plus_remainder
    answer: 2e-1
- id: calc.ch5.substitution.seed_polynomial_bounds
  knowledge_point: calc.ch5.substitution
  purpose: verification
  dimension: distractor
  stem: '用 $u=3x+2$ 换元，计算 $\int_0^2(3x+2)^2\,dx$'
  spec:
    operation: definite_integral
    expr: (3*x+2)**2
    bounds:
    - var: x
      lower: '0'
      upper: '2'
  answer: '56'
  predictions:
  - misconception_id: calc.ch5.substitution.old_bounds
    answer: '\frac{8}{9}'
  - misconception_id: calc.ch5.substitution.omit_differential
    answer: '168'
- id: calc.ch5.integration_by_parts.seed_sine_boundary
  knowledge_point: calc.ch5.integration_by_parts
  purpose: verification
  dimension: distractor
  stem: '取 $u=x,dv=\sin x\,dx$，计算 $\int_0^1 x\sin x\,dx$'
  spec:
    operation: definite_integral
    expr: x*sin(x)
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '\sin(1)-\cos(1)'
  predictions:
  - misconception_id: calc.ch5.integration_by_parts.omit_boundary
    answer: '\sin(1)'
  - misconception_id: calc.ch5.integration_by_parts.plus_remainder
    answer: '-\cos(1)-\sin(1)'
- id: calc.ch5.integration_by_parts.seed_x_cos
  knowledge_point: calc.ch5.integration_by_parts
  purpose: verification
  dimension: correctness
  stem: '计算 $\int_0^1 x\cos x\,dx$'
  spec:
    operation: definite_integral
    expr: x*cos(x)
    variables: [x]
    bounds:
    - var: x
      lower: '0'
      upper: '1'
  answer: '\sin(1)+\cos(1)-1'
- id: calc.ch5.integration_by_parts.seed_log
  knowledge_point: calc.ch5.integration_by_parts
  purpose: verification
  dimension: near_transfer
  stem: '计算 $\int_1^e \ln x\,dx$'
  spec:
    operation: definite_integral
    expr: log(x)
    variables: [x]
    bounds:
    - var: x
      lower: '1'
      upper: E
  answer: '1'
- id: calc.ch5.s1.c3_seed1
  knowledge_point: calc.ch5.s1
  purpose: verification
  dimension: correctness
  stem: '求 $\int_{-2}^{2}x^3\,dx$。'
  answer: '0'
  spec:
    operation: definite_integral
    expr: x**3
    bounds:
    - var: x
      lower: '-2'
      upper: '2'
- id: calc.ch5.s2.c3_seed1
  knowledge_point: calc.ch5.s2
  purpose: verification
  dimension: correctness
  stem: '设 $F(x)=\int_1^{3x}t^2\,dt$，求 F′(x)。'
  answer: '27x^2'
  spec:
    operation: derivative
    expr: 9*x**3-1/3
    variables:
    - x
- id: calc.ch5.s4.c3_seed1
  knowledge_point: calc.ch5.s4
  purpose: verification
  dimension: explanation
  stem: '判断通常意义的 $\int_{-2}^{2}1/x\,dx$ 是否收敛，说明理由。'
  answer: '不收敛。须在奇点 $0$ 两侧独立取极限；左侧积分趋于 $-\infty$，右侧趋于 $+\infty$，二者均不收敛。对称截断得到的主值 $0$ 不等于通常反常积分存在。'
  rubric:
  - 在奇点 0 分成两段并独立取极限。
  - 说明两段分别发散而不能相抵。
  - 区分主值与通常反常积分。
- id: calc.ch5.s5.c3_seed1
  knowledge_point: calc.ch5.s5
  purpose: verification
  dimension: explanation
  stem: '判断 $\int_1^{\infty}x^{-3}\,dx$ 是否收敛；能否仅凭 $0<x^{-3}\le x^{-1}$ 且后者积分发散就断言前者发散？'
  answer: '收敛，值为 $1/2$。截断积分为 $(1-R^{-2})/2$，$R\to\infty$ 时趋于 $1/2$。由较大函数发散不能推出较小函数发散；比较法须使用正确的上下界方向。'
  rubric:
  - 计算有限上限 R 的积分。
  - 取 R→∞ 得到有限值 1/2。
  - 指出所给比较不能推出发散，并说明比较法方向。
