misconceptions:
- id: calc.ch9.partial_derivative.vary_other
  knowledge_point: calc.ch9.partial_derivative
  family: 混淆变量依赖
  description: 求对 x 的偏导时把独立变量 y 也视作随 x 变化，并擅自取 dy/dx=1
  triggers: [二元函数求偏导, 未注明保持哪个变量不变]
  examples:
  - question: '求 $z=x^2y+y^3$ 对 $x$ 的偏导'
    wrong: '2xy+x^2+3y^2'
    correct: 2xy
  probes: [calc.ch9.partial_derivative.probe_fixed_y]
  recurs_in: [calc.ch9.multivar_chain, calc.ch9.s5, calc.ch9.s8]
  strategies: [variable_dependency]
- id: calc.ch9.partial_derivative.keep_constant_term
  knowledge_point: calc.ch9.partial_derivative
  family: 误用求导运算法则
  description: 求偏导时把与求导变量无关的加项原样保留，而不是求导为零
  triggers: [含纯 y 加项的函数]
  examples:
  - question: '求 $z=x^2y+y^3$ 对 $x$ 的偏导'
    wrong: '2xy+y^3'
    correct: 2xy
  probes: [calc.ch9.partial_derivative.probe_fixed_y]
  recurs_in: [calc.ch9.multivar_chain, calc.ch9.s8]
  strategies: [derivative_algebra]
- id: calc.ch9.multivar_chain.omit_path
  knowledge_point: calc.ch9.multivar_chain
  family: 遗漏复合依赖路径
  description: 中间变量有多条依赖路径时只计算第一条路径的贡献
  triggers: [两个及以上中间变量依赖同一自变量]
  examples:
  - question: '$z=u^2+v,u=t^2,v=3t$，求 $dz/dt$'
    wrong: '4t^3'
    correct: '4t^3+3'
  probes: [calc.ch9.multivar_chain.probe_two_paths]
  recurs_in: [calc.ch9.s5, calc.ch9.s7]
  strategies: [dependency_paths]
- id: calc.ch9.multivar_chain.omit_edge_rate
  knowledge_point: calc.ch9.multivar_chain
  family: 遗漏内层变化率
  description: 将外层对各中间变量的偏导直接相加，遗漏中间变量对自变量的导数
  triggers: [树形复合依赖]
  examples:
  - question: '$z=u^2+v,u=t^2,v=3t$，求 $dz/dt$'
    wrong: '2t^2+1'
    correct: '4t^3+3'
  probes: [calc.ch9.multivar_chain.probe_two_paths]
  recurs_in: [calc.ch9.s5, calc.ch9.s7]
  strategies: [inner_rate]
- id: calc.ch9.s1.c3.axes_prove_multivariate_limit
  knowledge_point: calc.ch9.s1
  family: 忽略多元变化的独立性与一致性
  description: 只验证坐标轴上的极限相同，就断言二元函数的整体极限存在。
  triggers:
  - 多元函数的基本概念
  examples:
  - question: 判断 $\lim_{(x,y)\to(0,0)}xy/(x^2+y^2)$ 是否存在，说明理由。
    wrong: 沿两坐标轴都为 0，所以极限为 0。
    correct: 不存在。沿 y=0 的值为 0；沿 y=x（x≠0）恒为 1/2。两条路径给出不同极限，故整体极限不存在。
  strategies:
  - c3.multivar
  recurs_in:
  - calc.ch9.s3
  - calc.ch9.s8
- id: calc.ch9.s3.c3.partials_imply_differentiability
  knowledge_point: calc.ch9.s3
  family: 忽略多元变化的独立性与一致性
  description: 把两个偏导数存在作为全微分存在的充分条件，忽略沿一般方向的余项。
  triggers:
  - 全微分
  examples:
  - question: 设 $f(x,y)=xy/\sqrt{x^2+y^2}$（非原点），f(0,0)=0。判断原点处是否可微，说明理由。
    wrong: 两个偏导数均为 0，所以可微且全微分为 0。
    correct: 不可微。两坐标轴上函数值为 0，故原点偏导数均为 0；若可微，线性部分只能为 0。沿 x=y=t≠0，$f(t,t)=|t|/\sqrt2$，除以距离 $\sqrt2|t|$ 得
      1/2，余项不是距离的高阶无穷小。
  strategies:
  - c3.multivar
  recurs_in:
  - calc.ch9.s6
  - calc.ch9.s9
- id: calc.ch9.s5.c3.implicit_partial_sign
  knowledge_point: calc.ch9.s5
  family: 混淆导数阶次或微分近似
  description: 由 F(x,y,z)=0 求隐函数偏导时把 −F_x/F_z 写成 F_x/F_z。
  triggers:
  - 隐函数的求导公式
  examples:
  - question: 由 $x^2+2y^2+3z-6=0$ 确定 z=z(x,y)，求 z 对 x 的偏导数。
    wrong: \frac{2x}{3}
    correct: -\frac{2x}{3}
  strategies:
  - c3.derivative
  recurs_in:
  - calc.ch9.s6
- id: calc.ch9.s6.c3.position_as_surface_normal
  knowledge_point: calc.ch9.s6
  family: 混淆空间几何对象与运算
  description: 把曲面上点的位置向量直接当作法向量，未对曲面方程求梯度。
  triggers:
  - 多元微分在几何上的应用
  examples:
  - question: 求曲面 $z=x^2+2y^2$ 在 (1,1,3) 处的切平面，并给出一个法向量。
    wrong: 以 (1,1,3) 为法向量，得 (x−1)+(y−1)+3(z−3)=0。
    correct: 设 F=x²+2y²−z，梯度在该点为 (2,4,−1)，可作法向量。切平面为 $2(x-1)+4(y-1)-(z-3)=0$，即 $2x+4y-z-3=0$。
  strategies:
  - c3.geometry
  recurs_in:
  - calc.ch11.s4
  - calc.ch11.s5
- id: calc.ch9.s7.c3.direction_not_normalized
  knowledge_point: calc.ch9.s7
  family: 忽略多元变化的独立性与一致性
  description: 把任意长度的方向向量直接与梯度点乘，遗漏单位化。
  triggers:
  - 方向导数与梯度
  examples:
  - question: 求 $f(x,y)=3x-y$ 沿向量 (3,4) 所指方向的方向导数。
    wrong: '5'
    correct: '1'
  strategies:
  - c3.multivar
  recurs_in:
  - calc.ch11.s5
- id: calc.ch9.s8.c3.critical_point_as_minimum
  knowledge_point: calc.ch9.s8
  family: 混淆局部条件与整体结论
  description: 把梯度为零的驻点直接判为极值，忽略二次型不定或退化的情形。
  triggers:
  - 多元函数的极值及其求法
  examples:
  - question: 判断 $f(x,y)=x^2-y^2$ 在原点是否有局部极值，说明理由。
    wrong: 梯度为零，所以原点是局部最小值点。
    correct: 没有局部极值，是鞍点。沿 y=0 时 f=x²>0，沿 x=0 时 f=−y²<0；任意小邻域内同时有高于和低于 f(0,0)=0 的值。Hessian 行列式为 -4，也表明不定。
  strategies:
  - c3.local_global
  recurs_in:
  - calc.ch9.s9
- id: calc.ch9.s9.c3.taylor_mixed_coefficient
  knowledge_point: calc.ch9.s9
  family: 忽略多元变化的独立性与一致性
  description: 二元二阶泰勒展开遗漏混合项的两次贡献，将 xy 项系数错写为 f_xy/2。
  triggers:
  - 二元函数的泰勒公式
  examples:
  - question: 写出 $f(x,y)=e^{x+y}$ 在原点的二阶泰勒多项式，并解释 xy 项系数。
    wrong: 1+x+y+x^2/2+xy/2+y^2/2
    correct: $P_2=1+x+y+x^2/2+xy+y^2/2$。二阶项为 $(f_{xx}x^2+2f_{xy}xy+f_{yy}y^2)/2$，原点三项二阶偏导均为 1，混合项系数因而为
      1。
  strategies:
  - c3.multivar
  recurs_in:
  - calc.ch9.s8

strategies:
- id: dependency_paths
  families: [遗漏复合依赖路径]
  principles:
  - 总导数包含从自变量到结果的所有依赖路径，各路径贡献相加，同一路径的变化率相乘。
  - 偏导数是在中间变量相互独立的表示中定义的，复合后的总变化须另计依赖。
  constraints:
  - 不因为某路径在图上较短就忽略它。
  - 不把全导数与对某一中间变量的偏导数混写。
  rubric:
  - 每条依赖路径均有对应导数项。
  - 能解释路径内相乘与路径间相加，并说明保持不变的变量。
- id: c3.multivar
  families:
  - 忽略多元变化的独立性与一致性
  principles:
  - 偏导数、全微分、方向导数和多元极限分别对应不同的变化方式。
  - 用依赖关系、单位方向和完整的二次型组织计算。
  constraints:
  - 不以少数路径的相同极限证明多元极限存在。
  - 不从偏导数存在直接推断可微。
  rubric:
  - 能明确独立变量、趋近路径与归一化方向。
  - 能按定义检验余项阶数或给出有效反例。

items:
- id: calc.ch9.partial_derivative.probe_fixed_y
  knowledge_point: calc.ch9.partial_derivative
  purpose: probe
  stem: '$x,y$ 独立，求 $z=x^2y+y^3$ 对 $x$ 的偏导'
  spec:
    operation: derivative
    expr: x**2*y+y**3
    variables: [x]
  answer: 2xy
  predictions:
  - misconception_id: calc.ch9.partial_derivative.vary_other
    answer: '2xy+x^2+3y^2'
  - misconception_id: calc.ch9.partial_derivative.keep_constant_term
    answer: '2xy+y^3'
- id: calc.ch9.partial_derivative.seed_product
  knowledge_point: calc.ch9.partial_derivative
  purpose: verification
  dimension: correctness
  stem: '$x,y$ 独立，求 $z=x^3y^2+\sin y$ 对 $x$ 的偏导'
  spec:
    operation: derivative
    expr: x**3*y**2+sin(y)
    variables: [x]
  answer: '3x^2y^2'
- id: calc.ch9.partial_derivative.seed_mixed
  knowledge_point: calc.ch9.partial_derivative
  purpose: verification
  dimension: near_transfer
  stem: '$x,y$ 独立，求 $z=x^2y^3$ 的混合偏导 $\partial_y(\partial_x z)$'
  spec:
    operation: derivative
    expr: x**2*y**3
    variables: [x, y]
  answer: '6xy^2'
- id: calc.ch9.multivar_chain.probe_two_paths
  knowledge_point: calc.ch9.multivar_chain
  purpose: probe
  stem: '$z=u^2+v,u=t^2,v=3t$，求 $dz/dt$'
  spec:
    operation: derivative
    expr: t**4+3*t
    variables: [t]
  answer: '4t^3+3'
  predictions:
  - misconception_id: calc.ch9.multivar_chain.omit_path
    answer: '4t^3'
  - misconception_id: calc.ch9.multivar_chain.omit_edge_rate
    answer: '2t^2+1'
- id: calc.ch9.multivar_chain.seed_product
  knowledge_point: calc.ch9.multivar_chain
  purpose: verification
  dimension: correctness
  stem: '$z=uv,u=s,v=s^2$，求 $dz/ds$'
  spec:
    operation: derivative
    expr: s**3
    variables: [s]
  answer: '3s^2'
- id: calc.ch9.multivar_chain.seed_partial_composite
  knowledge_point: calc.ch9.multivar_chain
  purpose: verification
  dimension: near_transfer
  stem: '$z=u^2+v,u=x+y,v=xy$，$x,y$ 独立，求复合后 $z$ 对 $x$ 的偏导'
  spec:
    operation: derivative
    expr: (x+y)**2+x*y
    variables: [x]
  answer: 2x+3y
- id: calc.ch9.partial_derivative.seed_fixed_other_distractor
  knowledge_point: calc.ch9.partial_derivative
  purpose: verification
  dimension: distractor
  stem: '设 $x,y$ 独立，求 $z=xy^2+y^4$ 对 $x$ 的偏导'
  spec:
    operation: derivative
    expr: x*y**2+y**4
    variables: [x]
  answer: 'y^2'
  predictions:
  - misconception_id: calc.ch9.partial_derivative.vary_other
    answer: 'y^2+2xy+4y^3'
  - misconception_id: calc.ch9.partial_derivative.keep_constant_term
    answer: 'y^2+y^4'
- id: calc.ch9.multivar_chain.seed_two_rates_distractor
  knowledge_point: calc.ch9.multivar_chain
  purpose: verification
  dimension: distractor
  stem: '设 $z=u+v^2,u=t^3,v=2t$，求 $dz/dt$'
  spec:
    operation: derivative
    expr: t**3+4*t**2
    variables: [t]
  answer: '3t^2+8t'
  predictions:
  - misconception_id: calc.ch9.multivar_chain.omit_path
    answer: '3t^2'
  - misconception_id: calc.ch9.multivar_chain.omit_edge_rate
    answer: '1+4t'
- id: calc.ch9.s1.c3_seed1
  knowledge_point: calc.ch9.s1
  purpose: verification
  dimension: explanation
  stem: 判断 $\lim_{(x,y)\to(0,0)}xy/(x^2+y^2)$ 是否存在，说明理由。
  answer: 不存在。沿 y=0 的值为 0；沿 y=x（x≠0）恒为 1/2。两条路径给出不同极限，故整体极限不存在。
  rubric:
  - 明确所选路径均趋于原点。
  - 算出两条路径的不同极限 0 与 1/2。
  - 说明少数路径相同不足以证明极限存在，而两条路径不同足以否定。
- id: calc.ch9.s3.c3_seed1
  knowledge_point: calc.ch9.s3
  purpose: verification
  dimension: explanation
  stem: 设 $f(x,y)=xy/\sqrt{x^2+y^2}$（非原点），f(0,0)=0。判断原点处是否可微，说明理由。
  answer: 不可微。两坐标轴上函数值为 0，故原点偏导数均为 0；若可微，线性部分只能为 0。沿 x=y=t≠0，$f(t,t)=|t|/\sqrt2$，除以距离 $\sqrt2|t|$ 得 1/2，余项不是距离的高阶无穷小。
  rubric:
  - 按定义求出两个偏导数均为零。
  - 确定候选线性部分为零。
  - 沿对角线计算余项与距离的比值 1/2，否定可微。
- id: calc.ch9.s5.c3_seed1
  knowledge_point: calc.ch9.s5
  purpose: verification
  dimension: correctness
  stem: 由 $x^2+2y^2+3z-6=0$ 确定 z=z(x,y)，求 z 对 x 的偏导数。
  answer: -\frac{2x}{3}
  spec:
    operation: derivative
    expr: (6-x**2-2*y**2)/3
    variables:
    - x
- id: calc.ch9.s6.c3_seed1
  knowledge_point: calc.ch9.s6
  purpose: verification
  dimension: explanation
  stem: 求曲面 $z=x^2+2y^2$ 在 (1,1,3) 处的切平面，并给出一个法向量。
  answer: 设 F=x²+2y²−z，梯度在该点为 (2,4,−1)，可作法向量。切平面为 $2(x-1)+4(y-1)-(z-3)=0$，即 $2x+4y-z-3=0$。
  rubric:
  - 对 F=x²+2y²−z 求梯度。
  - 在指定点取值且核对 F_z≠0。
  - 切平面通过指定点，法向量与梯度平行。
- id: calc.ch9.s7.c3_seed1
  knowledge_point: calc.ch9.s7
  purpose: verification
  dimension: correctness
  stem: 求 $f(x,y)=3x-y$ 沿向量 (3,4) 所指方向的方向导数。
  answer: '1'
  spec:
    operation: expression
    expr: (3*3-1*4)/sqrt(3**2+4**2)
- id: calc.ch9.s8.c3_seed1
  knowledge_point: calc.ch9.s8
  purpose: verification
  dimension: explanation
  stem: 判断 $f(x,y)=x^2-y^2$ 在原点是否有局部极值，说明理由。
  answer: 没有局部极值，是鞍点。沿 y=0 时 f=x²>0，沿 x=0 时 f=−y²<0；任意小邻域内同时有高于和低于 f(0,0)=0 的值。Hessian 行列式为 -4，也表明不定。
  rubric:
  - 核对原点为驻点。
  - 给出邻域内正值与负值的两条路径。
  - 说明梯度为零不保证极值，或使用负 Hessian 行列式判据。
- id: calc.ch9.s9.c3_seed1
  knowledge_point: calc.ch9.s9
  purpose: verification
  dimension: explanation
  stem: 写出 $f(x,y)=e^{x+y}$ 在原点的二阶泰勒多项式，并解释 xy 项系数。
  answer: $P_2=1+x+y+x^2/2+xy+y^2/2$。二阶项为 $(f_{xx}x^2+2f_{xy}xy+f_{yy}y^2)/2$，原点三项二阶偏导均为 1，混合项系数因而为 1。
  rubric:
  - 给出常数和两个一阶项。
  - 正确计算三个二阶偏导数。
  - 写明二次型中 2f_xy 与外部 1/2 的抵消。
