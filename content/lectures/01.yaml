misconceptions:
- id: calc.ch1.function.shift_outside
  knowledge_point: calc.ch1.function
  family: 混淆函数输入与输出
  description: 把自变量的增量直接加在函数值上，认为 f(x+h)=f(x)+h
  triggers: [输入为和式, 非线性函数]
  examples:
  - question: '设 $f(t)=t^2$，求 $f(x+1)$'
    wrong: 'x^2+1'
    correct: '(x+1)^2'
  probes: [calc.ch1.function.probe_shift]
  recurs_in: [calc.ch1.composition, calc.ch2.chain_rule, calc.ch9.multivar_chain]
  strategies: [input_output_mapping]
- id: calc.ch1.function.identity_value
  knowledge_point: calc.ch1.function
  family: 混淆函数输入与输出
  description: 忽略对应法则，把函数值 f(a) 直接写成输入 a
  triggers: [函数值计算, 自变量换字母]
  examples:
  - question: '设 $f(t)=t^2+1$，求 $f(2)$'
    wrong: '2'
    correct: '5'
  probes: [calc.ch1.function.probe_shift]
  recurs_in: [calc.ch1.composition, calc.ch9.partial_derivative]
  strategies: [input_output_mapping]
- id: calc.ch1.composition.reverse_order
  knowledge_point: calc.ch1.composition
  family: 误读复合结构
  description: 把 f(g(x)) 错写成 g(f(x))，颠倒内外层顺序
  triggers: [两个非交换的函数]
  examples:
  - question: '设 $f(t)=t^2,g(t)=t+1$，求 $f(g(x))$'
    wrong: 'x^2+1'
    correct: '(x+1)^2'
  probes: [calc.ch1.composition.probe_order]
  recurs_in: [calc.ch2.chain_rule, calc.ch2.chain_rule_multi, calc.ch9.multivar_chain]
  strategies: [composition_structure]
- id: calc.ch1.composition.multiply
  knowledge_point: calc.ch1.composition
  family: 误读复合结构
  description: 把函数复合误当作函数值相乘，认为 f(g(x))=f(x)g(x)
  triggers: [复合符号与乘法并存]
  examples:
  - question: '设 $f(t)=t^2,g(t)=t+1$，求 $f(g(x))$'
    wrong: 'x^2(x+1)'
    correct: '(x+1)^2'
  probes: [calc.ch1.composition.probe_order]
  recurs_in: [calc.ch2.chain_rule, calc.ch9.multivar_chain]
  strategies: [composition_structure]
- id: calc.ch1.s2.c3.bounded_implies_convergent
  knowledge_point: calc.ch1.s2
  family: 忽略数学命题的适用条件
  description: 把数列有界当作收敛的充分条件，未检查振荡或单调性。
  triggers:
  - 数列的极限
  examples:
  - question: '数列 $a_n=(-1)^n+1/n$ 是否收敛？请说明理由。'
    wrong: '有界，所以收敛到 0。'
    correct: '不收敛。偶数子列 $a_{2k}=1+1/(2k)\to1$，奇数子列 $a_{2k-1}=-1+1/(2k-1)\to-1$；两个子列极限不同。'
  strategies:
  - c3.conditions
  recurs_in:
  - calc.ch12.s1
- id: calc.ch1.s3.c3.one_side_as_two_sides
  knowledge_point: calc.ch1.s3
  family: 误用极限与无穷小运算
  description: 只计算一个单侧极限，就把它当作双侧极限。
  triggers:
  - 函数的极限
  examples:
  - question: '判断 $\lim_{x\to2}|x-2|/(x-2)$ 是否存在，并说明理由。'
    wrong: '1'
    correct: '双侧极限不存在。左侧恒为 $-1$，右侧恒为 $1$；两个单侧极限不相等。'
  strategies:
  - c3.limit
  recurs_in:
  - calc.ch1.s8
  - calc.ch2.s1
- id: calc.ch1.s4.c3.infinitesimal_is_zero
  knowledge_point: calc.ch1.s4
  family: 误用极限与无穷小运算
  description: 把趋于零的变量当作恒等于零，忽略其与无界因子相乘时的整体行为。
  triggers:
  - 无穷小与无穷大
  examples:
  - question: '求 $\lim_{x\to0^+}x\cdot(1/x)$。'
    wrong: '0'
    correct: '1'
  strategies:
  - c3.limit
  recurs_in:
  - calc.ch1.s5
  - calc.ch3.s2
- id: calc.ch1.s5.c3.quotient_zero_denominator
  knowledge_point: calc.ch1.s5
  family: 误用极限与无穷小运算
  description: 分母极限为零时仍直接使用商的极限法则，看到 0/0 就判定极限不存在。
  triggers:
  - 极限运算法则
  examples:
  - question: '求 $\lim_{x\to3}(x^2-9)/(x-3)$。'
    wrong: '分母为零，所以极限不存在。'
    correct: '6'
  strategies:
  - c3.limit
  recurs_in:
  - calc.ch3.s2
- id: calc.ch1.s6.c3.important_limit_scale
  knowledge_point: calc.ch1.s6
  family: 误用极限与无穷小运算
  description: 把 $(1+ax)^{1/x}$ 的极限一律写成 e，遗漏底数增量与指数的比例。
  triggers:
  - 极限存在准则、两个重要极限
  examples:
  - question: '求 $\lim_{x\to0}(1+3x)^{1/x}$（在底数为正的邻域内取极限）。'
    wrong: 'e'
    correct: 'e^3'
  strategies:
  - c3.limit
  recurs_in:
  - calc.ch3.s2
  - calc.ch12.s4
- id: calc.ch1.s7.c3.equivalent_in_difference
  knowledge_point: calc.ch1.s7
  family: 误用极限与无穷小运算
  description: 在相减且首阶相消的表达式中直接用等价无穷小替换，丢失更高阶主项。
  triggers:
  - 无穷小的比较
  examples:
  - question: '求 $\lim_{x\to0}(\sin x-x)/x^3$。'
    wrong: '0'
    correct: '-\frac{1}{6}'
  strategies:
  - c3.limit
  recurs_in:
  - calc.ch3.s3
- id: calc.ch1.s8.c3.value_implies_continuity
  knowledge_point: calc.ch1.s8
  family: 忽略数学命题的适用条件
  description: 把一点有定义当作连续，未核对该点极限与函数值是否相等。
  triggers:
  - 函数的连续性与间断点
  examples:
  - question: '设 $f(x)=(x^2-1)/(x-1)$（$x\ne1$），$f(1)=a$。求使 f 在 1 连续的 a，并说明理由。'
    wrong: '任意 a 均可，因为 f(1) 已定义。'
    correct: '$a=2$。在去心邻域内 $f(x)=x+1$，故极限为 $2$；连续还要求 $f(1)$ 等于该极限。'
  strategies:
  - c3.conditions
  recurs_in:
  - calc.ch2.s1
  - calc.ch3.s1
- id: calc.ch1.s9.c3.continuous_outside_domain
  knowledge_point: calc.ch1.s9
  family: 忽略数学命题的适用条件
  description: 以初等函数连续为由忽略实数定义域，认为复合函数处处连续。
  triggers:
  - 连续函数的运算与初等函数的连续性
  examples:
  - question: '求实函数 $f(x)=\ln(x^2-1)$ 的定义域，并说明在哪些点连续。'
    wrong: '在全体实数上连续。'
    correct: '须有 $x^2-1>0$，所以定义域为 $(-\infty,-1)\cup(1,\infty)$；在此定义域内处处连续。'
  strategies:
  - c3.conditions
  recurs_in:
  - calc.ch4.s1
  - calc.ch9.s1
- id: calc.ch1.s10.c3.drop_closed_interval
  knowledge_point: calc.ch1.s10
  family: 忽略数学命题的适用条件
  description: 把闭区间连续函数的最值定理直接用于开区间，不区分上确界与最大值。
  triggers:
  - 闭区间上连续函数性质
  examples:
  - question: '$f(x)=x$ 在 $(0,1)$ 上连续。它是否取得最大值和最小值？说明理由。'
    wrong: '最大值 1，最小值 0。'
    correct: '均不取得。每个 $x\in(0,1)$ 两侧仍有区间内的点，函数值可更小也可更大；上确界为 $1$、下确界为 $0$，但端点不在定义域内。'
  strategies:
  - c3.conditions
  recurs_in:
  - calc.ch3.s5
  - calc.ch9.s8
strategies:
- id: input_output_mapping
  families: [混淆函数输入与输出]
  principles:
  - 函数名、自变量的哑符号和对应法则承担不同角色，换字母不改变对应法则。
  - 输入须作为整体进入法则；函数值的变化通常不等于输入的变化。
  constraints:
  - 不把 f(x+h)=f(x)+h 当作恒等式。
  - 不以记住某一道题的展开式代替理解输入输出关系。
  rubric:
  - 能明确指出本题的完整输入。
  - 能用原对应法则解释结果，并在出现分母或根式时说明定义域限制。
- id: composition_structure
  families: [误读复合结构]
  principles:
  - 复合是一种有方向的输入输出连接；外层接收的是内层的整个输出。
  - 中间变量和依赖关系应与函数表达式一致，层数由运算结构决定。
  constraints:
  - 不把复合符号解释为乘号。
  - 不靠由左到右读字面顺序决定运算先后。
  rubric:
  - 能指出内层和外层并写出有顺序的复合；求导时外层导数取在内层值处。
  - 能用输入输出关系解释复合顺序，并区分复合与乘法。
- id: c3.conditions
  families:
  - 忽略数学命题的适用条件
  principles:
  - 区分必要条件与充分条件，并把定理假设与题目条件逐一对应。
  - 用满足部分条件但结论失败的反例检验过度推广。
  constraints:
  - 不从有限数值样本推出一般性定理。
  - 不把结论正确当作使用了正确理由。
  rubric:
  - 能列出所用定理的关键假设。
  - 能指出缺失条件以及有效的反例或补充条件。
- id: c3.limit
  families:
  - 误用极限与无穷小运算
  principles:
  - 极限描述趋近过程，函数值、极限值和恒等式需要分别判断。
  - 代入、商法则和等价替换均须满足条件；相消时检查保留项的阶。
  constraints:
  - 不把无穷小直接当作恒等于零。
  - 不在减法中无条件替换等价无穷小。
  rubric:
  - 能说明趋近变量、方向和定义域。
  - 能写出合法变形，并解释相消后首个非零项或左右极限。
items:
- id: calc.ch1.function.probe_shift
  knowledge_point: calc.ch1.function
  purpose: probe
  stem: '设 $f(t)=t^2$，求 $f(x+2)$'
  spec:
    operation: expression
    expr: (x+2)**2
    variables: [x]
  answer: '(x+2)^2'
  predictions:
  - misconception_id: calc.ch1.function.shift_outside
    answer: 'x^2+2'
  - misconception_id: calc.ch1.function.identity_value
    answer: x+2
- id: calc.ch1.function.seed_scaled_input
  knowledge_point: calc.ch1.function
  purpose: verification
  dimension: correctness
  stem: '设 $f(t)=t^2+1$，求 $f(2h)$'
  spec:
    operation: expression
    expr: 4*h**2+1
    variables: [h]
  answer: '4h^2+1'
- id: calc.ch1.function.seed_shifted_input
  knowledge_point: calc.ch1.function
  purpose: verification
  dimension: near_transfer
  stem: '设 $f(t)=1/(t+2)$，求 $f(a-2)$，其中 $a\ne0$'
  spec:
    operation: expression
    expr: 1/a
    variables: [a]
  answer: '\frac{1}{a}'
- id: calc.ch1.composition.probe_order
  knowledge_point: calc.ch1.composition
  purpose: probe
  stem: '设 $f(t)=t^2,g(t)=t+1$，求 $f(g(x))$'
  spec:
    operation: expression
    expr: (x+1)**2
    variables: [x]
  answer: '(x+1)^2'
  predictions:
  - misconception_id: calc.ch1.composition.reverse_order
    answer: 'x^2+1'
  - misconception_id: calc.ch1.composition.multiply
    answer: 'x^2(x+1)'
- id: calc.ch1.composition.seed_exp
  knowledge_point: calc.ch1.composition
  purpose: verification
  dimension: correctness
  stem: '设 $f(t)=e^t,g(t)=2t$，求 $f(g(x))$'
  spec:
    operation: expression
    expr: exp(2*x)
    variables: [x]
  answer: 'e^{2x}'
- id: calc.ch1.composition.seed_rational
  knowledge_point: calc.ch1.composition
  purpose: verification
  dimension: near_transfer
  stem: '设 $f(t)=1/t,g(t)=t^2+1$，求 $f(g(x))$'
  spec:
    operation: expression
    expr: 1/(x**2+1)
    variables: [x]
  answer: '\frac{1}{x^2+1}'
- id: calc.ch1.s6.seed_sine_ratio
  knowledge_point: calc.ch1.s6
  purpose: verification
  dimension: correctness
  stem: '求 $\lim_{x\to0}\frac{\sin(3x)}{x}$'
  spec:
    operation: limit
    expr: sin(3*x)/x
    variables: [x]
    limit_point: '0'
  answer: '3'
- id: calc.ch1.s7.seed_cosine_order
  knowledge_point: calc.ch1.s7
  purpose: verification
  dimension: near_transfer
  stem: '求 $\lim_{x\to0}\frac{1-\cos x}{x^2}$'
  spec:
    operation: limit
    expr: (1-cos(x))/x**2
    variables: [x]
    limit_point: '0'
  answer: '\frac{1}{2}'
- id: calc.ch1.s3.seed_right_abs
  knowledge_point: calc.ch1.s3
  purpose: verification
  dimension: correctness
  stem: '求 $\lim_{x\to0^+}\frac{|x|}{x}$；注意这是右极限'
  spec:
    operation: limit
    expr: Abs(x)/x
    variables: [x]
    limit_point: '0'
    limit_direction: +
  answer: '1'
- id: calc.ch1.function.seed_cubic_input
  knowledge_point: calc.ch1.function
  purpose: verification
  dimension: distractor
  stem: '设 $f(t)=t^3$，求 $f(3x-1)$'
  spec:
    operation: expression
    expr: (3*x-1)**3
    variables: [x]
  answer: '(3x-1)^3'
  predictions:
  - misconception_id: calc.ch1.function.shift_outside
    answer: '27x^3-1'
  - misconception_id: calc.ch1.function.identity_value
    answer: '3x-1'
- id: calc.ch1.composition.seed_affine_cubic
  knowledge_point: calc.ch1.composition
  purpose: verification
  dimension: distractor
  stem: '设 $f(t)=t^3,g(t)=2t-1$，求 $f(g(x))$'
  spec:
    operation: expression
    expr: (2*x-1)**3
    variables: [x]
  answer: '(2x-1)^3'
  predictions:
  - misconception_id: calc.ch1.composition.reverse_order
    answer: '2x^3-1'
  - misconception_id: calc.ch1.composition.multiply
    answer: 'x^3(2x-1)'
- id: calc.ch1.s2.c3_seed1
  knowledge_point: calc.ch1.s2
  purpose: verification
  dimension: explanation
  stem: '数列 $a_n=(-1)^n+1/n$ 是否收敛？请说明理由。'
  answer: '不收敛。偶数子列 $a_{2k}=1+1/(2k)\to1$，奇数子列 $a_{2k-1}=-1+1/(2k-1)\to-1$；两个子列极限不同。'
  rubric:
  - 写出奇偶子列。
  - 分别求出子列极限 1 与 -1。
  - 用收敛数列的所有子列极限相同否定收敛，并区分有界与收敛。
- id: calc.ch1.s3.c3_seed1
  knowledge_point: calc.ch1.s3
  purpose: verification
  dimension: explanation
  stem: '判断 $\lim_{x\to2}|x-2|/(x-2)$ 是否存在，并说明理由。'
  answer: '双侧极限不存在。左侧恒为 $-1$，右侧恒为 $1$；两个单侧极限不相等。'
  rubric:
  - 在 x<2 与 x>2 分别化简绝对值。
  - 得到左极限 -1、右极限 1。
  - 依据两个单侧极限不相等判定双侧极限不存在。
- id: calc.ch1.s4.c3_seed1
  knowledge_point: calc.ch1.s4
  purpose: verification
  dimension: correctness
  stem: '求 $\lim_{x\to0^+}x\cdot(1/x)$。'
  answer: '1'
  spec:
    operation: limit
    expr: x*(1/x)
    variables:
    - x
    limit_point: '0'
    limit_direction: +
- id: calc.ch1.s5.c3_seed1
  knowledge_point: calc.ch1.s5
  purpose: verification
  dimension: correctness
  stem: '求 $\lim_{x\to3}(x^2-9)/(x-3)$。'
  answer: '6'
  spec:
    operation: limit
    expr: (x**2-9)/(x-3)
    variables:
    - x
    limit_point: '3'
    limit_direction: +-
- id: calc.ch1.s6.c3_seed1
  knowledge_point: calc.ch1.s6
  purpose: verification
  dimension: correctness
  stem: '求 $\lim_{x\to0}(1+3x)^{1/x}$（在底数为正的邻域内取极限）。'
  answer: 'e^3'
  spec:
    operation: limit
    expr: (1+3*x)**(1/x)
    variables:
    - x
    limit_point: '0'
    limit_direction: +-
- id: calc.ch1.s7.c3_seed1
  knowledge_point: calc.ch1.s7
  purpose: verification
  dimension: correctness
  stem: '求 $\lim_{x\to0}(\sin x-x)/x^3$。'
  answer: '-\frac{1}{6}'
  spec:
    operation: limit
    expr: (sin(x)-x)/x**3
    variables:
    - x
    limit_point: '0'
    limit_direction: +-
- id: calc.ch1.s8.c3_seed1
  knowledge_point: calc.ch1.s8
  purpose: verification
  dimension: explanation
  stem: '设 $f(x)=(x^2-1)/(x-1)$（$x\ne1$），$f(1)=a$。求使 f 在 1 连续的 a，并说明理由。'
  answer: '$a=2$。在去心邻域内 $f(x)=x+1$，故极限为 $2$；连续还要求 $f(1)$ 等于该极限。'
  rubric:
  - 只在 x≠1 时约去 x-1。
  - 求得极限 2。
  - 由函数值等于极限确定唯一的 a=2。
