misconceptions:
- id: calc.ch3.s1.c3.rolle_without_differentiability
  knowledge_point: calc.ch3.s1
  family: 忽略数学命题的适用条件
  description: 只因函数连续且端点相等就使用罗尔定理，忽略开区间可导条件。
  triggers:
  - 微分中值定理
  examples:
  - question: '$f(x)=|x|$ 在 [-1,1] 上端点相等，是否存在 ξ∈(-1,1) 使 f′(ξ)=0？说明理由。'
    wrong: '由罗尔定理，ξ=0。'
    correct: '不存在。$x<0$ 时导数为 $-1$，$x>0$ 时导数为 $1$，$x=0$ 不可导。罗尔定理的开区间可导条件不成立。'
  strategies:
  - c3.conditions
  recurs_in:
  - calc.ch3.s2
  - calc.ch3.s5
- id: calc.ch3.s2.c3.lhopital_without_indeterminate_form
  knowledge_point: calc.ch3.s2
  family: 忽略数学命题的适用条件
  description: 未确认 0/0 或 ∞/∞ 型就将分子分母分别求导。
  triggers:
  - 洛必达法则
  examples:
  - question: '求 $\lim_{x\to0}(3+x)/(5+x)$。'
    wrong: '1'
    correct: '\frac{3}{5}'
  strategies:
  - c3.conditions
  recurs_in:
  - calc.ch5.s4
- id: calc.ch3.s3.c3.taylor_missing_factorial
  knowledge_point: calc.ch3.s3
  family: 混淆导数阶次或微分近似
  description: 泰勒系数直接写成各阶导数值，遗漏阶乘分母。
  triggers:
  - 泰勒公式
  examples:
  - question: '求 $\lim_{x\to0}(e^{2x}-1-2x)/x^2$。'
    wrong: '4'
    correct: '2'
  strategies:
  - c3.derivative
  recurs_in:
  - calc.ch9.s9
  - calc.ch12.s4
- id: calc.ch3.s4.c3.convexity_as_monotonicity
  knowledge_point: calc.ch3.s4
  family: 混淆局部条件与整体结论
  description: 用二阶导数的正负直接判断函数增减，混淆凹凸性与单调性。
  triggers:
  - 函数的单调性与曲线的凹凸性
  examples:
  - question: '判断 $f(x)=x^2$ 在 (-1,0) 上的单调性，并解释 f″>0 的含义。'
    wrong: 'f″=2>0，所以函数递增。'
    correct: '$f^{\prime}(x)=2x<0$，故严格递减；$f^{\prime^{\prime}}(x)=2>0$ 表示导数递增、图像向上弯曲，不表示函数值递增。'
  strategies:
  - c3.local_global
  recurs_in:
  - calc.ch3.s6
  - calc.ch9.s8
- id: calc.ch3.s5.c3.stationary_implies_extremum
  knowledge_point: calc.ch3.s5
  family: 混淆局部条件与整体结论
  description: 把 f′=0 当作极值的充分条件，忽略邻域符号和区间端点。
  triggers:
  - 函数的极值与最值
  examples:
  - question: '求 $f(x)=x^3$ 在 [-1,2] 上的最值，并判断 x=0 是否为极值点。'
    wrong: 'f′(0)=0，所以 x=0 是最小值点。'
    correct: '函数严格递增，最小值为 $f(-1)=-1$，最大值为 $f(2)=8$；$0$ 两侧函数值一负一正，故 $0$ 是驻点但非极值点。'
  strategies:
  - c3.local_global
  recurs_in:
  - calc.ch9.s8
- id: calc.ch3.s6.c3.denominator_zero_as_asymptote
  knowledge_point: calc.ch3.s6
  family: 混淆局部条件与整体结论
  description: 只要有理式分母为零就判为垂直渐近线，未检查去心极限。
  triggers:
  - 函数图形的描绘
  examples:
  - question: '对 $f(x)=(x^2-4)/(x-2)$（x≠2），判断 x=2 是否为垂直渐近线，说明该处图形。'
    wrong: '分母为零，所以 x=2 是垂直渐近线。'
    correct: '不是。$x\ne2$ 时 $f(x)=x+2$，故 $x\to2$ 时极限为 $4$；图像为直线 $y=x+2$ 去掉点 $(2,4)$，该点是可去间断处。'
  strategies:
  - c3.local_global
  recurs_in:
  - calc.ch1.s8
- id: calc.ch3.s7.c3.curvature_without_slope_factor
  knowledge_point: calc.ch3.s7
  family: 混淆导数阶次或微分近似
  description: 把平面曲线曲率直接写成 |y″|，省略斜率引起的归一化因子。
  triggers:
  - 曲率
  examples:
  - question: '求曲线 $y=3x^2$ 的曲率函数，并写明所用导数。'
    wrong: '6'
    correct: '$y^{\prime}=6x,y^{\prime^{\prime}}=6$，所以 $\kappa(x)=|y^{\prime^{\prime}}|/(1+(y^{\prime})^2)^{3/2}=6/(1+36x^2)^{3/2}$。'
  strategies:
  - c3.derivative
  recurs_in:
  - calc.ch11.s1
strategies:
- id: c3.local_global
  families:
  - 混淆局部条件与整体结论
  principles:
  - 驻点、单调性、凹凸性和最值分别需要对应的判据。
  - 结合定义域、边界与邻域内的符号变化确定结论。
  constraints:
  - 不把驻点直接标成极值。
  - 不把图形直觉代替边界或邻域检验。
  rubric:
  - 能给出导数或二次型判据及其适用条件。
  - 能独立核对边界、不可导点或多条趋近路径。
items:
- id: calc.ch3.s1.c3_seed1
  knowledge_point: calc.ch3.s1
  purpose: verification
  dimension: explanation
  stem: '$f(x)=|x|$ 在 [-1,1] 上端点相等，是否存在 ξ∈(-1,1) 使 f′(ξ)=0？说明理由。'
  answer: '不存在。$x<0$ 时导数为 $-1$，$x>0$ 时导数为 $1$，$x=0$ 不可导。罗尔定理的开区间可导条件不成立。'
  rubric:
  - 检查 0 处的可导性。
  - 说明其余点的导数均不为零。
  - 准确指出罗尔定理缺失的条件。
- id: calc.ch3.s2.c3_seed1
  knowledge_point: calc.ch3.s2
  purpose: verification
  dimension: correctness
  stem: '求 $\lim_{x\to0}(3+x)/(5+x)$。'
  answer: '\frac{3}{5}'
  spec:
    operation: limit
    expr: (3+x)/(5+x)
    variables:
    - x
    limit_point: '0'
    limit_direction: +-
- id: calc.ch3.s3.c3_seed1
  knowledge_point: calc.ch3.s3
  purpose: verification
  dimension: correctness
  stem: '求 $\lim_{x\to0}(e^{2x}-1-2x)/x^2$。'
  answer: '2'
  spec:
    operation: limit
    expr: (exp(2*x)-1-2*x)/x**2
    variables:
    - x
    limit_point: '0'
    limit_direction: +-
- id: calc.ch3.s4.c3_seed1
  knowledge_point: calc.ch3.s4
  purpose: verification
  dimension: explanation
  stem: '判断 $f(x)=x^2$ 在 (-1,0) 上的单调性，并解释 f″>0 的含义。'
  answer: '$f^{\prime}(x)=2x<0$，故严格递减；$f^{\prime^{\prime}}(x)=2>0$ 表示导数递增、图像向上弯曲，不表示函数值递增。'
  rubric:
  - 用一阶导数判定递减。
  - 说明二阶导数控制斜率变化。
  - 区分函数增减与曲线凹凸性。
- id: calc.ch3.s5.c3_seed1
  knowledge_point: calc.ch3.s5
  purpose: verification
  dimension: explanation
  stem: '求 $f(x)=x^3$ 在 [-1,2] 上的最值，并判断 x=0 是否为极值点。'
  answer: '函数严格递增，最小值为 $f(-1)=-1$，最大值为 $f(2)=8$；$0$ 两侧函数值一负一正，故 $0$ 是驻点但非极值点。'
  rubric:
  - 检查驻点 0 的两侧变化。
  - 比较闭区间端点并给出最值。
  - 区分驻点、局部极值与区间最值。
- id: calc.ch3.s6.c3_seed1
  knowledge_point: calc.ch3.s6
  purpose: verification
  dimension: explanation
  stem: '对 $f(x)=(x^2-4)/(x-2)$（x≠2），判断 x=2 是否为垂直渐近线，说明该处图形。'
  answer: '不是。$x\ne2$ 时 $f(x)=x+2$，故 $x\to2$ 时极限为 $4$；图像为直线 $y=x+2$ 去掉点 $(2,4)$，该点是可去间断处。'
  rubric:
  - 在去心邻域中约分。
  - 使用有限极限 4 排除垂直渐近线。
  - 保留原定义域中的缺点 (2,4)。
- id: calc.ch3.s7.c3_seed1
  knowledge_point: calc.ch3.s7
  purpose: verification
  dimension: explanation
  stem: '求曲线 $y=3x^2$ 的曲率函数，并写明所用导数。'
  answer: '$y^{\prime}=6x,y^{\prime^{\prime}}=6$，所以 $\kappa(x)=|y^{\prime^{\prime}}|/(1+(y^{\prime})^2)^{3/2}=6/(1+36x^2)^{3/2}$。'
  rubric:
  - 分别求出 y′ 与 y″。
  - 使用包含 (1+(y′)²)^(3/2) 的曲率公式。
  - 曲率非负，且不能省略分母。
