  exam_tags: [math1, math2, math3]
- section: 2
  title: 换元积分法
  exam_tags: [math1, math2, math3]
- section: 3
  title: 分部积分法
  exam_tags: [math1, math2, math3]
- section: 4
  title: 有理函数的积分
  exam_tags: [math1, math2]
points:
- id: calc.ch4.s1
  section: 1
  name: 不定积分的概念与性质
  prerequisites: [calc.ch2.derivative_rules]
- id: calc.ch4.substitution
  section: 2
  name: 不定积分的换元法
  prerequisites: [calc.ch4.s1, calc.ch2.chain_rule]
- id: calc.ch4.s3
  section: 3
  name: 分部积分法
  prerequisites: [calc.ch4.s1, calc.ch2.derivative_rules]
- id: calc.ch4.s4
  section: 4
  name: 有理函数的积分
  prerequisites: [calc.ch4.s1, calc.ch4.substitution]
misconceptions:
- id: calc.ch4.substitution.omit_scale
  knowledge_point: calc.ch4.substitution
  family: 忽略微元变换
  description: '换元时只替换被积函数，不按 du=g''(x)dx 变换微元'
  triggers: [内层为非单位斜率的线性函数]
  examples:
  - question: '求 $\int e^{3x}\,dx$'
    wrong: 'e^{3x}+C'
    correct: '\frac{1}{3}e^{3x}+C'
  probes: [calc.ch4.substitution.probe_linear_exp]
  recurs_in: [calc.ch5.substitution, calc.ch10.polar]
  strategies: [differential_measure]
- id: calc.ch4.substitution.multiply_scale
  knowledge_point: calc.ch4.substitution
  family: 混淆求导与积分
  description: 把链式求导中的乘内层导数照搬到积分，导致应除的系数变成乘
  triggers: [线性换元]
  examples:
  - question: '求 $\int e^{3x}\,dx$'
    wrong: '3e^{3x}+C'
    correct: '\frac{1}{3}e^{3x}+C'
  probes: [calc.ch4.substitution.probe_linear_exp]
  recurs_in: [calc.ch5.substitution]
  strategies: [inverse_differentiation]
- id: calc.ch4.s1.c3.log_antiderivative_domain
  knowledge_point: calc.ch4.s1
  family: 误用原函数与积分代数法则
  description: 将 1/x 的原函数一律写成 ln(x)，忽略负半轴上的实数定义域。
  triggers:
  - 不定积分的概念与性质
  examples:
  - question: 在区间 x<2 上，求 $1/(x-2)$ 的一个实原函数。
    wrong: \ln(x-2)
    correct: \ln(2-x)
  strategies:
  - c3.antiderivative
  recurs_in:
  - calc.ch5.s4
  - calc.ch7.s2
- id: calc.ch4.s3.c3.by_parts_wrong_subtraction
  knowledge_point: calc.ch4.s3
  family: 误用原函数与积分代数法则
  description: 使用分部积分时把 uv−∫vdu 写成 uv+∫vdu。
  triggers:
  - 分部积分法
  examples:
  - question: 求 $\int x\cos(2x)\,dx$ 的一个原函数。
    wrong: \frac{x\sin(2x)}{2}-\frac{\cos(2x)}{4}
    correct: \frac{x\sin(2x)}{2}+\frac{\cos(2x)}{4}
  strategies:
  - c3.antiderivative
  recurs_in:
  - calc.ch5.integration_by_parts
  - calc.ch12.s6
- id: calc.ch4.s4.c3.partial_fraction_wrong_sign
  knowledge_point: calc.ch4.s4
  family: 误用原函数与积分代数法则
  description: 部分分式分解时忽略系数符号，未通分核对分子。
  triggers:
  - 有理函数的积分
  examples:
  - question: 在 x>0 上求 $\int 1/[x(x+2)]\,dx$ 的一个原函数。
    wrong: \frac{1}{2}\ln x+\frac{1}{2}\ln(x+2)
    correct: \frac{1}{2}\ln x-\frac{1}{2}\ln(x+2)
  strategies:
  - c3.antiderivative
  recurs_in:
  - calc.ch5.s4
  - calc.ch7.s2

strategies:
- id: differential_measure
  families: [忽略微元变换]
  principles:
  - 换元改变了自变量的刻度，函数值和微元必须一起变换才能保持积分不变。
  - 一维的微元缩放与二维的面积缩放具有同样的测度含义。
  constraints:
  - 不只替换函数中的字母而保留旧微元。
  - 不把不定积分中的方向因子和二重积分的面积因子机械混同。
  rubric:
  - 能从 du 与 dx 的关系解释系数。
  - 不定积分能用求导检验原函数并保留积分常数；定积分能核对变换后的端点与方向。
- id: inverse_differentiation
  families: [混淆求导与积分]
  principles:
  - 求原函数是在寻找导数等于被积函数的函数，链式法则用于检验候选而非照搬系数。
  constraints:
  - 不以看到复合就乘内层导数的口令处理积分。
  rubric:
  - 候选原函数求导后与被积函数一致。
  - 能解释为什么线性换元中出现倒数系数。
- id: c3.antiderivative
  families:
  - 误用原函数与积分代数法则
  principles:
  - 用求导回代检验原函数，变形须在原定义域内等价。
  - 分部积分来自乘积求导，部分分式须通分检验。
  constraints:
  - 不忽略对数、分母等表达式的定义域。
  - 不凭记忆省略分部积分的负号或原函数族中的参数。
  rubric:
  - 能通过求导或通分核对关键等式。
  - 能明确解的区间及积分常数的作用。

items:
- id: calc.ch4.substitution.probe_linear_exp
  knowledge_point: calc.ch4.substitution
  purpose: probe
  stem: '求 $\int e^{3x}\,dx$'
  spec:
    operation: indefinite_integral
    expr: exp(3*x)
    variables: [x]
  answer: '\frac{1}{3}e^{3x}+C'
  predictions:
  - misconception_id: calc.ch4.substitution.omit_scale
    answer: 'e^{3x}+C'
  - misconception_id: calc.ch4.substitution.multiply_scale
    answer: '3e^{3x}+C'
- id: calc.ch4.substitution.seed_sine
  knowledge_point: calc.ch4.substitution
  purpose: verification
  dimension: correctness
  stem: '求 $\int \sin(4x)\,dx$'
  spec:
    operation: indefinite_integral
    expr: sin(4*x)
    variables: [x]
  answer: '-\frac{1}{4}\cos(4x)+C'
- id: calc.ch4.substitution.seed_quadratic
  knowledge_point: calc.ch4.substitution
  purpose: verification
  dimension: near_transfer
  stem: '求 $\int 2x\cos(x^2)\,dx$'
  spec:
    operation: indefinite_integral
    expr: 2*x*cos(x**2)
    variables: [x]
  answer: '\sin(x^2)+C'
- id: calc.ch4.substitution.seed_cos_affine_distractor
  knowledge_point: calc.ch4.substitution
  purpose: verification
  dimension: distractor
  stem: '求 $\int \cos(5x+1)\,dx$'
  spec:
    operation: indefinite_integral
    expr: cos(5*x+1)
    variables: [x]
  answer: '\frac{\sin(5x+1)}{5}+C'
  predictions:
  - misconception_id: calc.ch4.substitution.omit_scale
    answer: '\sin(5x+1)+C'
  - misconception_id: calc.ch4.substitution.multiply_scale
    answer: '5\sin(5x+1)+C'
- id: calc.ch4.s1.c3_seed1
  knowledge_point: calc.ch4.s1
  purpose: verification
  dimension: correctness
  stem: 在区间 x<2 上，求 $1/(x-2)$ 的一个实原函数。
  answer: \ln(2-x)
  spec:
    operation: indefinite_integral
    expr: 1/(x-2)
    variables:
    - x
- id: calc.ch4.s3.c3_seed1
  knowledge_point: calc.ch4.s3
  purpose: verification
  dimension: correctness
  stem: 求 $\int x\cos(2x)\,dx$ 的一个原函数。
  answer: \frac{x\sin(2x)}{2}+\frac{\cos(2x)}{4}
  spec:
    operation: indefinite_integral
    expr: x*cos(2*x)
    variables:
    - x
- id: calc.ch4.s4.c3_seed1
  knowledge_point: calc.ch4.s4
  purpose: verification
  dimension: correctness
  stem: 在 x>0 上求 $\int 1/[x(x+2)]\,dx$ 的一个原函数。
  answer: \frac{1}{2}\ln x-\frac{1}{2}\ln(x+2)
  spec:
    operation: indefinite_integral
    expr: 1/(x*(x+2))
    variables:
    - x
