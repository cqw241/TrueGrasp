misconceptions:
- id: calc.ch4.substitution.omit_scale
  knowledge_point: calc.ch4.substitution
  family: 忽略微元变换
  description: '换元时只替换被积函数，不按 du=g''(x)dx 变换微元'
  triggers: [内层为非单位斜率的线性函数]
  examples:
  - question: '求 $\int e^{3x}\,dx$'
    wrong: 'e^{3x}+C'
    correct: '\frac{1}{3}e^{3x}+C'
  probes: [calc.ch4.substitution.probe_linear_exp]
  recurs_in: [calc.ch5.substitution, calc.ch10.polar]
  strategies: [differential_measure]
- id: calc.ch4.substitution.multiply_scale
  knowledge_point: calc.ch4.substitution
  family: 混淆求导与积分
  description: 把链式求导中的乘内层导数照搬到积分，导致应除的系数变成乘
  triggers: [线性换元]
  examples:
  - question: '求 $\int e^{3x}\,dx$'
    wrong: '3e^{3x}+C'
    correct: '\frac{1}{3}e^{3x}+C'
  probes: [calc.ch4.substitution.probe_linear_exp]
  recurs_in: [calc.ch5.substitution]
  strategies: [inverse_differentiation]
strategies:
- id: differential_measure
  families: [忽略微元变换]
  principles:
  - 换元改变了自变量的刻度，函数值和微元必须一起变换才能保持积分不变。
  - 一维的微元缩放与二维的面积缩放具有同样的测度含义。
  constraints:
  - 不只替换函数中的字母而保留旧微元。
  - 不把不定积分中的方向因子和二重积分的面积因子机械混同。
  rubric:
  - 能从 du 与 dx 的关系解释系数。
  - 不定积分能用求导检验原函数并保留积分常数；定积分能核对变换后的端点与方向。
- id: inverse_differentiation
  families: [混淆求导与积分]
  principles:
  - 求原函数是在寻找导数等于被积函数的函数，链式法则用于检验候选而非照搬系数。
  constraints:
  - 不以看到复合就乘内层导数的口令处理积分。
  rubric:
  - 候选原函数求导后与被积函数一致。
  - 能解释为什么线性换元中出现倒数系数。
items:
- id: calc.ch4.substitution.probe_linear_exp
  knowledge_point: calc.ch4.substitution
  purpose: probe
  stem: '求 $\int e^{3x}\,dx$'
  spec:
    operation: indefinite_integral
    expr: exp(3*x)
    variables: [x]
  answer: '\frac{1}{3}e^{3x}+C'
  predictions:
  - misconception_id: calc.ch4.substitution.omit_scale
    answer: 'e^{3x}+C'
  - misconception_id: calc.ch4.substitution.multiply_scale
    answer: '3e^{3x}+C'
- id: calc.ch4.substitution.seed_sine
  knowledge_point: calc.ch4.substitution
  purpose: verification
  dimension: correctness
  stem: '求 $\int \sin(4x)\,dx$'
  spec:
    operation: indefinite_integral
    expr: sin(4*x)
    variables: [x]
  answer: '-\frac{1}{4}\cos(4x)+C'
- id: calc.ch4.substitution.seed_quadratic
  knowledge_point: calc.ch4.substitution
  purpose: verification
  dimension: near_transfer
  stem: '求 $\int 2x\cos(x^2)\,dx$'
  spec:
    operation: indefinite_integral
    expr: 2*x*cos(x**2)
    variables: [x]
  answer: '\sin(x^2)+C'
