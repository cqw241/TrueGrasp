[project]
name = "truegrasp-backend"
version = "0.1.0"
description = "真懂 AI 后端：高校高等数学自主教学 Agent"
requires-python = ">=3.13"
dependencies = [
    "antlr4-python3-runtime==4.11.*",
    "fastapi>=0.115",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "networkx>=3.7",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "sympy>=1.14",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
