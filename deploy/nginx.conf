# Alibaba Cloud Linux / BaoTa nginx. Other builds may not need lua_package_path.
user nobody;
worker_processes 1;
worker_shutdown_timeout 5s;
pid /run/truegrasp-nginx.pid;
error_log /var/log/truegrasp-gateway/error.log warn;

events { worker_connections 1024; }

http {
    lua_package_path "/www/server/nginx/lib/lua/?.lua;;";
    include /www/server/nginx/conf/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    access_log /var/log/truegrasp-gateway/access.log;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

    server {
        listen 80;
        server_name 8.148.178.2;
        return 308 https://8.148.178.2$request_uri;
    }

    server {
        listen 443 ssl;
        server_name 8.148.178.2;
        ssl_certificate /etc/truegrasp/tls/fullchain.pem;
        ssl_certificate_key /etc/truegrasp/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:5m;
        ssl_session_tickets off;
        root /opt/truegrasp/current/frontend/dist;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = /api/auth/login {
            limit_req zone=login burst=10 nodelay;
            limit_req_status 429;
            include /etc/truegrasp/proxy.conf;
        }
        location /api/ { include /etc/truegrasp/proxy.conf; }
        location /assets/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-store";
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
